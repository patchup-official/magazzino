# render.yaml — Magazzino v3.0
# Usa il database valutazione-display-db già esistente

services:

  # ── BACKEND ──────────────────────────────────────────────────────────────
  - type: web
    name: magazzino-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://magazzino-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      # DATABASE_URL va impostata manualmente nel dashboard Render
      # usando la Internal URL di valutazione-display-db:
      # postgresql://valutazione_display_db_user:4CVFD4SyuKuoJsn7Y3aRr6nqgl2WbW0s@dpg-d71qj4f5gffc7381fn50-a/valutazione_display_db

  # ── FRONTEND ─────────────────────────────────────────────────────────────
  - type: web
    name: magazzino-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://magazzino-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

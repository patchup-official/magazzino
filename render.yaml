# render.yaml — Magazzino v3.0
# Posiziona nella ROOT del repository

services:

  # ── BACKEND ──────────────────────────────────────────────────────────────
  - type: web
    name: magazzino-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://magazzino-frontend.onrender.com   # aggiorna dopo deploy
      - key: DATABASE_URL
        fromDatabase:
          name: magazzino-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render genera automaticamente un secret sicuro
      - key: SUPER_ADMIN_USERNAME
        value: superadmin            # cambia se vuoi un username diverso
      # SUPER_ADMIN_PASSWORD va impostata manualmente nel dashboard Render
      # dopo il primo deploy, poi esegui: node db/seed-superadmin.js

  # ── FRONTEND ─────────────────────────────────────────────────────────────
  - type: web
    name: magazzino-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://magazzino-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── DATABASE POSTGRESQL ───────────────────────────────────────────────────
databases:
  - name: magazzino-db
    databaseName: magazzino
    user: magazzino_user
    plan: free                       # piano gratuito Render (90 giorni, poi $7/mese)

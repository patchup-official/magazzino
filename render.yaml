# render.yaml — Magazzino v3.0
# Posiziona nella ROOT del repository

databases:
  - name: magazzino-db
    databaseName: magazzino
    user: magazzino_user
    plan: free

services:

  # ── BACKEND ──────────────────────────────────────────────────────────────
  - type: web
    name: magazzino-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: magazzino-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://magazzino-frontend.onrender.com
      - key: SUPER_ADMIN_USERNAME
        value: superadmin

  # ── FRONTEND ─────────────────────────────────────────────────────────────
  - type: web
    name: magazzino-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://magazzino-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# render.yaml — Magazzino v3.0

services:

  - type: web
    name: magazzino-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://magazzino-frontend-f6qd.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        value: superadmin

  - type: web
    name: magazzino-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://magazzino-backend-f7vr.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
